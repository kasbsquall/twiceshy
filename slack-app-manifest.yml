display_information:
  name: TwiceShy
  description: Settles SLA credits exactly once, with a human approval.
features:
  bot_user:
    display_name: TwiceShy
    always_online: true
oauth_config:
  scopes:
    bot:
      - channels:history
      - channels:read
      - channels:manage
      - channels:join
      - groups:history
      - chat:write
      - chat:write.customize
      - users:read
settings:
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
