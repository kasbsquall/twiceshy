name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Guard, runner, workflow and real process kill tests
        run: npm test
      - name: Offline demo, no keys
        run: |
          npm run demo:offline -- --scenario s1-lookalike
          npm run demo:offline -- --scenario s7-crash
